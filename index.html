<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cenacolo Culturale Tool Scambi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #161b26;
      --border-color: #262d3d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --primary: #2ea043;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .header-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 20px;
    }

    .team-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .team-logo {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border-color);
      display: none; /* Nascondi di default finché non c'è selezione */
      background-color: #000;
    }

    .team-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      margin: 0;
    }

    select {
      width: 100%;
      padding: 10px;
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <!-- TITOLO AGGIORNATO -->
  <h1 class="header-title">Cenacolo Culturale Tool Scambi</h1>

  <div style="display: flex; gap: 20px; flex-wrap: wrap;">
    
    <!-- SQUADRA A -->
    <div style="flex: 1; min-width: 300px; background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color);">
      <div class="team-header">
        <img id="logoA" class="team-logo" src="" alt="Stemma Squadra A">
        <h2 class="team-title" id="titleA">Squadra A</h2>
      </div>

      <label for="selectA" style="color: var(--text-muted); font-size: 0.9rem;">Seleziona Squadra A:</label>
      <select id="selectA" onchange="updateTeam('A')">
        <option value="" disabled selected>-- Seleziona una squadra --</option>
        <option value="Mignottingamm forest" data-logo="mignottingham.jpg">Mignottingamm forest</option>
        <option value="Royale equipe" data-logo="royale.jpg">Royale equipe</option>
        <option value="Cogito ergo sum" data-logo="cogito.jpg">Cogito ergo sum</option>
        <option value="Bouc d'hercule" data-logo="bouc.jpg">Bouc d'hercule</option>
        <option value="Temptation Haaland" data-logo="temptation.jpg">Temptation Haaland</option>
        <option value="Herta Baccaio" data-logo="herta.jpg">Herta Baccaio</option>
        <option value="Disparis snai germain" data-logo="disparis.jpg">Disparis snai germain</option>
        <option value="Sparapizza FC" data-logo="sparapizza.jpg">Sparapizza FC</option>
        <option value="Bollitones" data-logo="bollitones.jpg">Bollitones</option>
        <option value="Il Calcio" data-logo="ilcalcio.jpg">Il Calcio</option>
      </select>
    </div>

    <!-- SQUADRA B -->
    <div style="flex: 1; min-width: 300px; background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color);">
      <div class="team-header">
        <img id="logoB" class="team-logo" src="" alt="Stemma Squadra B">
        <h2 class="team-title" id="titleB">Squadra B</h2>
      </div>

      <label for="selectB" style="color: var(--text-muted); font-size: 0.9rem;">Seleziona Squadra B:</label>
      <select id="selectB" onchange="updateTeam('B')">
        <option value="" disabled selected>-- Seleziona una squadra --</option>
        <option value="Mignottingamm forest" data-logo="mignottingham.jpg">Mignottingamm forest</option>
        <option value="Royale equipe" data-logo="royale.jpg">Royale equipe</option>
        <option value="Cogito ergo sum" data-logo="cogito.jpg">Cogito ergo sum</option>
        <option value="Bouc d'hercule" data-logo="bouc.jpg">Bouc d'hercule</option>
        <option value="Temptation Haaland" data-logo="temptation.jpg">Temptation Haaland</option>
        <option value="Herta Baccaio" data-logo="herta.jpg">Herta Baccaio</option>
        <option value="Disparis snai germain" data-logo="disparis.jpg">Disparis snai germain</option>
        <option value="Sparapizza FC" data-logo="sparapizza.jpg">Sparapizza FC</option>
        <option value="Bollitones" data-logo="bollitones.jpg">Bollitones</option>
        <option value="Il Calcio" data-logo="ilcalcio.jpg">Il Calcio</option>
      </select>
    </div>

  </div>

  <script>
    function updateTeam(teamSide) {
      const selectElement = document.getElementById('select' + teamSide);
      const selectedOption = selectElement.options[selectElement.selectedIndex];
      
      const logoImg = document.getElementById('logo' + teamSide);
      const logoPath = selectedOption.getAttribute('data-logo');

      if (logoPath) {
        logoImg.src = logoPath;
        logoImg.style.display = 'block';
      }
    }
  </script>
</body>
</html>
